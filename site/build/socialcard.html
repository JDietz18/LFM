<!doctype html>
<meta charset="utf-8">
<title>Social card render</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#EDE5D8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 128px,rgba(120,100,78,.10) 128px,rgba(120,100,78,.22) 132px,rgba(120,100,78,.30) 134px,rgba(255,255,255,.75) 134px,rgba(255,255,255,.75) 136px,rgba(255,255,255,.25) 138px,transparent 140px);background-position:0 30px;font-family:'Cormorant Garamond',Georgia,serif;color:#3A3532}
.card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:430px 1fr;align-items:center;gap:40px;padding:0 70px;box-sizing:border-box}
.window{position:relative;width:400px;height:500px}
.frame{position:absolute;inset:0;border-radius:999px 999px 24px 24px;background:#FFFDF8;box-shadow:0 30px 60px -30px rgba(58,53,50,.45),0 0 0 1px rgba(58,53,50,.08)}
.pane{position:absolute;inset:12px;border-radius:999px 999px 16px 16px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(58,53,50,.15),inset 0 18px 30px -20px rgba(58,53,50,.5)}
.pane img{width:100%;height:100%;object-fit:cover}
.sill{position:absolute;left:-24px;right:-24px;bottom:-16px;height:22px;border-radius:6px;background:#FFFDF8;box-shadow:0 12px 24px -12px rgba(58,53,50,.5)}
.ivy{position:absolute;left:-40px;top:-24px;width:250px;filter:drop-shadow(0 3px 3px rgba(58,53,50,.18))}
.ivy.r{left:auto;right:-40px;transform:scaleX(-1)}
.copy{text-align:center}
.copy img{width:560px;display:block;margin:0 auto 18px}
.tag{font-style:italic;font-size:34px;line-height:1.3;margin:0 auto;max-width:520px}
.sub{font-family:'Nunito',system-ui,sans-serif;font-size:20px;color:#6B635D;margin-top:22px}
</style>
<div class="card">
  <div class="window">
    <div class="frame"></div>
    <div class="pane"><img src="../img/kitten-cream-blue-eyes.jpg" alt=""></div>
    <div class="sill"></div>
    <img class="ivy" src="../assets/ivy-garland.svg" alt="">
    <img class="ivy r" src="../assets/ivy-garland-b.svg" alt="">
  </div>
  <div class="copy">
    <img src="../assets/logo-a-wordmark-ivy.svg" alt="LittleFoot Munchkins">
    <p class="tag">Short legs, big personalities. Munchkin kittens raised in our home, one litter at a time.</p>
    <p class="sub">littlefoot munchkins &middot; a small home cattery</p>
  </div>
</div>
